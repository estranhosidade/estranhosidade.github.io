* {
  box-sizing: border-box;
  /* Match the theme-wide monospace look (theme style.css: * {font-family: Consolas}). */
  font-family: Consolas, monospace;
}
html,
body {
  margin: 0 !important;
  padding: 0 !important;
  min-height: 100%;
  background-color: var(--bg-color-search);
  background-repeat: repeat;
  color: var(--text-color-search);
  font: 12px/1.28 Arial, Helvetica, sans-serif;
}
@media (prefers-color-scheme: dark) {
  html,
  body {
    background-image: var(--dark-bg-image, none) !important;
    background-repeat: repeat !important;
    background-size: auto;
  }
  .search-input,
  .sort-select,
  .go-back-btn {
    background-color: var(--input-bg-search);
  }
}
a {
  color: var(--link-color-search);
  text-decoration: none;
}
a:hover {
  text-decoration: underline;
}
.date-label {
  color: var(--text-color-search);
  font-weight: bold;
}
.date-value,
.categories-value,
.tags-value {
  color: var(--text-muted-search);
}
.page {
  max-width: 1200px;
  margin: 0 auto;
  padding: 16px 18px 28px;
}
.hero {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 10px;
  padding-top: 8px;
  margin-bottom: 20px;
}
.search-line {
  display: inline-flex;
  align-items: center;
  flex-wrap: wrap;
  width: 100%;
  flex: 1;
  gap: 8px;
  vertical-align: middle;
}
label {
  align-self: center;
  color: var(--text-muted-search);
  white-space: nowrap;
}
#search-label {
  display: none;
}
.search-input {
  width: 100%;
  flex: 1 1 600px;
  height: 30px;
  padding: 4px 12px;
  border: 1px solid var(--border-color-search);
  border-radius: 4px;
  background: var(--input-bg-search);
  color: var(--text-color-search);
  outline: none;
}
.search-input:focus {
  border-color: var(--primary-color-search);
  box-shadow: inset 0 1px 2px #00000014;
}
.sort-select {
  height: 30px;
  padding: 0 5px;
  border: 1px solid var(--border-color-search);
  border-radius: 4px;
  background: var(--input-bg-search);
  color: var(--text-color-search);
  font-size: 12px;
  cursor: pointer;
}
.go-back-btn {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  height: 30px;
  padding: 0 12px;
  border: 1px solid var(--border-color-search);
  border-radius: 4px;
  background: var(--input-bg-search);
  color: var(--text-color-search);
  font-size: 12px;
  cursor: pointer;
  transition: background 0.2s, border-color 0.2s;
}
.go-back-btn:hover {
  border-color: var(--primary-color-search);
  color: var(--primary-color-search);
}
.go-back-btn svg {
  width: 14px;
  height: 14px;
}
.meta {
  margin: 18px 0 14px;
  color: var(--text-muted-search);
  font-size: 12px;
}
.meta .highlight {
  background: none;
  color: inherit;
  padding: 0;
}
.results {
  max-width: 100%;
  margin: 0;
}
.result {
  margin: 0 0 18px;
}
.result-title {
  display: inline-block;
  color: var(--link-color-search);
  font-size: 15px;
  font-weight: bold;
  line-height: 1.2;
}
.result-title:visited {
  color: var(--visited-color-search);
}
.result-url {
  max-width: 100%;
  margin: 1px 0 2px;
  overflow: hidden;
  color: var(--url-color-search);
  font-size: 13px;
  white-space: nowrap;
  text-overflow: ellipsis;
}
.result-snippet {
  color: var(--text-color-search);
  font-size: 13px;
  line-height: 1.4;
}
.result-extra {
  margin-top: 3px;
  color: var(--text-muted-search);
  font-size: 12px;
}
.empty,
.error,
.intro {
  margin: 20px 0 0;
  color: var(--text-color-search);
}
.error {
  color: #ef4444;
}
.tips {
  margin-top: 14px;
  color: var(--text-muted-search);
  font-size: 12px;
}
.state-hidden {
  display: none !important;
}
.highlight {
  padding: 1px 2px;
  border-radius: 2px;
  background: #fff804;
  color: #000;
}
.progress-container {
  display: none;
  position: relative;
  width: 100%;
  height: 4px;
  margin: 10px 0;
  overflow: hidden;
  border-radius: 2px;
  background: var(--border-color-search);
}
.progress-bar {
  position: absolute;
  left: -30%;
  width: 30%;
  height: 100%;
  background: var(--primary-color-search);
  animation: progress-move 1.5s infinite linear;
}
.pager {
  margin-top: 20px;
}
.pager-links {
  display: flex;
  gap: 15px;
  margin-top: 8px;
}
@keyframes progress-move {
  0% { left: -30%; width: 20%; }
  50% { width: 50%; }
  100% { left: 100%; width: 20%; }
}
@media (max-width: 700px) {
  .page {
    padding: 10px 12px 24px;
  }
  .hero {
    flex-direction: column;
    align-items: flex-start;
    gap: 10px;
  }
  .sort-select {
    width: 100%;
    margin-left: 0;
  }
  .search-input {
    min-width: 0;
  }
}</style>

var indexPromise = null;
var currentQuery = '';

/* -- Index loading (fetched into memory — never offered as a file download) -- */
function loadIndex(){
  if (!indexPromise) {
    if (progEl) progEl.classList.remove('state-hidden');
    indexPromise = fetch(cfg.indexUrl, { cache: 'force-cache' })
      .then(function(r){
        if (!r.ok) throw new Error('HTTP ' + r.status);
        return r.text();
      })
      .then(function(t){
        var data = JSON.parse(String(t).replace(/^\uFEFF+/, '').trim());

function lower(s){ return String(s == null ? '' : s).toLowerCase(); }
function pad2(n){ n = parseInt(n, 10); return (n < 10 ? '0' : '') + n; }

/* -- Query parsing — port of cbs_parse_query (Custom Blog Search) -- */
function parseQuery(query){

function containsWholeTerm(haystack, term){

      title:   lower(item.title),

  if (p.author  && row.author.indexOf(lower(p.author)) === -1) return false;

  for (var i = 0; i < p.excludes.length; i++) {
    var ex = p.excludes[i];
    if (ex && all.indexOf(lower(ex)) !== -1) return false;

/* -- Relevance score (static analogue of the live server's match ranking):
   whole-term hits in the title weigh most, then summary, then body. -- */
function countOccurrences(haystack, term){
  if (!haystack || !term) return 0;
  var t = lower(term);
  if (haystack === t) return 1000; /* exact field match dominates */
  var n = 0, found = 0;
  while (true) {
    found = haystack.indexOf(t, found);
    if (found === -1) return n;
    var before = found > 0 ? haystack.charAt(found - 1) : '';
    var after  = (found + t.length) < haystack.length ? haystack.charAt(found + t.length) : '';
    if (!isWord(before) && !isWord(after)) n++;
    found = found + 1;
  }
}
function scoreItem(row, p){
  var terms = snippetTerms(p.alternates || []);
  if (!terms.length) return 0;
  var score = 0;
  terms.forEach(function(t){
    var c = countOccurrences(row.title, t);
    if (c) score += Math.min(1000, c) * 4;
    var cs = countOccurrences(row.summary, t);
    if (cs) score += Math.min(1000, cs) * 2;
    score += Math.min(1000, countOccurrences(row.body, t));
  });
  return score;
}

function runSearch(items, rawQuery, sort){
  var p = parseQuery(rawQuery);
  if (p.text === '' && !p.author && !p.after && !p.before && !p.id && !p.related) {
    return { parsed: p, rows: [] };
  }
  var prepared = prepare(items);
  var rows = [];
  var exprs = p.alternates.length ? p.alternates : [''];
  for (var i = 0; i < prepared.length; i++) {
    var row = prepared[i];
    if (!passesOperators(row, p)) continue;
    if (!passesExcludes(row, p)) continue;
    var ok = (p.text === '');
    if (!ok) {
      for (var j = 0; j < exprs.length; j++) {
        if (expressionMatches(row, exprs[j])) { ok = true; break; }
      }
    }
    if (ok) {
      row.score = scoreItem(row, p);
      rows.push(row);
    }
  }
  rows.sort(function(a, b){
    var byDate = a.date < b.date ? -1 : (a.date > b.date ? 1 : 0);
    if (sort === 'oldest') return byDate;
    if (sort === 'relevance') {
      if (b.score !== a.score) return b.score - a.score;
      return -byDate; /* ties: newest first */
    }
    return -byDate; /* 'newest' (and any unknown value default) */
  });
  return { parsed: p, rows: rows };
}
/* -- Snippet terms — port of cbs_snippet_terms -- */
function snippetTerms(alternates){
  var terms = [], seen = {}, out = [];
  (alternates || []).forEach(function(expr){
    if (!expr) return;
    var mm = String(expr).match(/"([^"]+)"/g);
    if (mm) mm.forEach(function(q){
      var ph = q.slice(1, -1).trim();
      if (ph) terms.push(ph);
    });
    var unquoted = String(expr).replace(/"[^"]*"/g, ' ').trim();
    if (!unquoted) return;
    unquoted.split(/[\s|]+/).forEach(function(token){
      if (!token) return;
      if (/^(?:author|after|before|id|relatedsearch(?:\[[^\]]+\])?):/i.test(token)) return;
      terms.push(token);
    });
  });
  terms.forEach(function(t){
    var k = lower(t);
    if (!k || seen[k]) return;
    seen[k] = true;
    out.push(t);
  });
  out.sort(function(a, b){ return b.length - a.length; });
  return out;
}

/* -- Keyword-centred snippet — port of cbs_keyword_snippet -- */
function keywordSnippet(text, terms, radius, maxWindows){
  radius = radius || 60;
  maxWindows = maxWindows || 4;
  if (!text || !terms || !terms.length) return null;
  var h = lower(text), hlen = h.length;
  var matches = [];
  terms.forEach(function(term, idx){
    var t = lower(term), tlen = t.length;
    if (!tlen || tlen > hlen) return;
    var offset = 0, counter = 0, cap = 40;
    while (counter < cap) {
      var found = h.indexOf(t, offset);
      if (found === -1) break;
      var before = found > 0 ? h.charAt(found - 1) : '';
      var after  = (found + tlen) < hlen ? h.charAt(found + tlen) : '';
      if (!isWord(before) && !isWord(after)) {
        matches.push({ start: found, end: found + tlen, term: idx });
        counter++;
      }
      offset = found + 1;
    }
  });
  if (!matches.length) return null;
  matches.sort(function(a, b){ return a.start - b.start; });
  var mergeGap = 60, clusters = [], current = null;
  matches.forEach(function(m){
    if (current && m.start <= current.end + mergeGap) {
      if (m.end > current.end) current.end = m.end;
      current.terms[m.term] = true;
      return;
    }
    if (current) clusters.push(current);
    var tset = {}; tset[m.term] = true;
    current = { start: m.start, end: m.end, terms: tset };
  });
  if (current) clusters.push(current);
  clusters.forEach(function(c){
    var n = 0, k;
    for (k in c.terms) n++;
    c.score = n;
    c.bonus = 1 / (1 + c.start / 1000);
  });
  var remaining = {};
  matches.forEach(function(m){ remaining[m.term] = true; });
  var selected = [], pool = clusters.map(function(_, i){ return i; });
  while (true) {
    var keys = 0, k2;
    for (k2 in remaining) keys++;
    if (!keys || !pool.length) break;
    var best = -1, bestNew = -1, bestScore = -1;
    pool.forEach(function(pi){
      var c = clusters[pi], newTerms = 0, tt;
      for (tt in c.terms) if (remaining[tt]) newTerms++;
      var sc = c.score + c.bonus;
      if (newTerms > bestNew || (newTerms === bestNew && sc > bestScore)) {
        best = pi; bestNew = newTerms; bestScore = sc;
      }
    });
    if (best === -1 || bestNew === 0) break;
    selected.push(best);
    for (var tt2 in clusters[best].terms) delete remaining[tt2];
    pool = pool.filter(function(x){ return x !== best; });
  }
  if (selected.length < maxWindows) {
    pool.sort(function(a, b){
      var sb = clusters[b].score + clusters[b].bonus;
      var sa = clusters[a].score + clusters[a].bonus;
      return sb - sa;
    });
    for (var pi2 = 0; pi2 < pool.length && selected.length < maxWindows; pi2++) {
      var tooClose = false;
      for (var si = 0; si < selected.length; si++) {
        if (Math.abs(clusters[pool[pi2]].start - clusters[selected[si]].start) < 80) { tooClose = true; break; }
      }
      if (!tooClose) selected.push(pool[pi2]);
    }
  }
  selected.sort(function(a, b){ return clusters[a].start - clusters[b].start; });
  var pieces = [], prevShown = -1;
  selected.forEach(function(si){
    var c = clusters[si];
    var wStart = Math.max(0, c.start - radius);
    var wEnd = Math.min(hlen, c.end + radius);
    if (wStart > 0) {
      var seg = h.substring(wStart, c.start);
      var sp = seg.indexOf(' ');
      if (sp !== -1) {
        wStart += sp + 1;
      } else {
        var backFrom = Math.max(0, wStart - 20);
        var rb = h.lastIndexOf(' ', wStart - 1);
        if (rb !== -1 && rb >= backFrom) wStart = rb + 1;
      }
    }
    if (wEnd < hlen) {
      var seg2 = h.substring(c.end, wEnd);
      var rb2 = seg2.lastIndexOf(' ');
      if (rb2 !== -1) {
        wEnd = c.end + rb2;
      } else {
        var fwdLen = Math.min(20, hlen - wEnd);
        if (fwdLen > 0) {
          var fp = h.indexOf(' ', wEnd);
          if (fp !== -1 && fp < wEnd + fwdLen) wEnd = fp;
        }
      }
    }
    if (prevShown >= 0 && wStart < prevShown) wStart = prevShown;
    if (wStart >= wEnd) return;
    var piece = text.substring(wStart, wEnd).trim().replace(/^[•\-–—\s]+/, '');
    if (!piece) return;
    pieces.push({ text: piece, pre: wStart > 0, suf: wEnd < hlen });
    prevShown = wEnd;
  });
  if (!pieces.length) return null;
  var outStr = '', last = null;
  pieces.forEach(function(pc, i){
    if (i === 0) outStr += (pc.pre ? '[...] ' : '') + pc.text;
    else if ((last && last.suf) || pc.pre) outStr += ' [...] ' + pc.text;
    else outStr += ' ' + pc.text;
    last = pc;
  });
  if (last && last.suf) outStr += ' [...]';
  return outStr.replace(/(?:\s*\[\.\.\.\]){2,}/g, ' [...]').replace(/\s+/g, ' ').trim();
}

/* -- Highlighting — port of the live plugin's helpers -- */
var _decoder = document.createElement('div');
function decodeEntities(s){
  _decoder.textContent = s == null ? '' : String(s);
  return _decoder.innerHTML;
}
function esc(v){
  var d = document.createElement('div');
  d.textContent = decodeEntities(v == null ? '' : String(v));
  return d.innerHTML;
}
function getHighlightTerms(q){
  if (!q) return [];
  var text = q;
  text = text.replace(/\b(?:author|after|before|id|relatedsearch(?:\[[^\]]+\])?):(?:"[^"]+"|'[^']+'|\S+)/gi, ' ');
  text = text.replace(/["']/g, ' ');
  text = text.replace(/(^|\s)-(?:"[^"]*"|'[^']*'|\S+)/g, ' ');
  text = text.replace(/(^|\s)OR(?=\s|$)/g, ' ');
  var terms = text.split(/[\s|]+/).map(function(t){ return t.trim(); }).filter(function(t){ return t.length > 0; });
  var seen = {}, uniq = [];
  terms.forEach(function(t){
    var k = t.toLowerCase();
    if (!seen[k]) { seen[k] = true; uniq.push(t); }
  });
  uniq.sort(function(a, b){ return b.length - a.length; });
  return uniq;
}
function highlight(text, q){
  var safe = esc(text);
  var terms = getHighlightTerms(q);
  if (!terms.length) return safe;
  var pattern = terms.map(function(term){ return term.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'); }).join('|');
  if (!pattern) return safe;
  var regex;
  try {
    regex = new RegExp('(?<![\p{L}\p{N}])(' + pattern + ')(?![\p{L}\p{N}])', 'giu');
  } catch (e) {
    regex = new RegExp('(' + pattern + ')', 'gi');
  }
  return safe.replace(regex, function(m){ return '<span class="highlight">' + m + '</span>'; });
}
function highlightArray(items, q){
  if (!items || !items.length) return '';
  return items.map(function(item){ return highlight(item, q); }).join(', ');
}
function fmtDate(v){
  var p = String(v || '').split('-');
  if (p.length !== 3) return v || i18n.not_available || 'N/A';
  var months = i18n.months || [];
  return (months[parseInt(p[1], 10) - 1] || p[1]) + ' ' + parseInt(p[2], 10) + ', ' + p[0];
}

function intro(){
  fbEl.innerHTML = '<div class="intro">' + esc(i18n.intro) + '<div class="tips">' + esc(i18n.operators_hint) + '</div></div>';
  resEl.innerHTML = '';
  if (pagerEl) { pagerEl.classList.add('state-hidden'); pagerEl.innerHTML = ''; }
}

function renderResult(row, q, parsed){
  var item = row.item;
  var terms = snippetTerms(parsed && parsed.alternates ? parsed.alternates : []);
  var body = itemBody(item);
  var snippet = (body && terms.length) ? keywordSnippet(body, terms) : null;
  if (snippet === null) snippet = item.summary || i18n.no_text_preview;
  var tags = (item.tags || []).map(termName).filter(Boolean);
  var cats = (item.cats || []).map(termName).filter(Boolean);
  var buf = '<article class="result">'
    + '<a class="result-title" target="_top" href="' + esc(item.url) + '">' + highlight(item.title || i18n.untitled, q) + '</a>'
    + '<div class="result-url">' + highlight((cfg.baseUrl||'') + item.url, q) + '</div>'
    + '<div class="result-snippet">' + highlight(snippet, q) + '</div>'
    + '<div class="result-extra"><span class="date-label">' + esc(i18n.created_on) + '</span> <span class="date-value">' + esc(fmtDate(item.date)) + '</span></div>';
  if (tags.length) buf += '<div class="result-extra"><span class="date-label">' + esc(i18n.tags) + '</span> <span class="tags-value">' + highlightArray(tags, q) + '</span></div>';
  if (cats.length) buf += '<div class="result-extra"><span class="date-label">' + esc(i18n.categories) + '</span> <span class="categories-value">' + highlightArray(cats, q) + '</span></div>';
  buf += '</article>';
  return buf;
}

function renderResults(page){
  var rows = state.rows;
  var total = rows.length;
  var pages = total ? Math.ceil(total / PER_PAGE) : 0;
  if (page > pages) page = pages || 1;
  if (page < 1) page = 1;
  if (!total) {
    fbEl.innerHTML = '<div class="empty">' + esc(i18n.no_results) + '</div>';
    resEl.innerHTML = '';
    if (pagerEl) { pagerEl.classList.add('state-hidden'); pagerEl.innerHTML = ''; }
    return;
  }
  var extra = (state.parsed && state.parsed.related) ? ' <span class="tips">' + esc(i18n.relatedsearch_detected) + '</span>' : '';
  fbEl.innerHTML = '<div class="meta">' + esc(i18n.about) + ' ' + Number(total).toLocaleString() + ' '
    + (total === 1 ? i18n.result_for : i18n.results_for) + ' <b>' + esc(state.q) + '</b>' + extra + '</div>';
  var slice = rows.slice((page - 1) * PER_PAGE, page * PER_PAGE);
  var buf = '';
  slice.forEach(function(row){ buf += renderResult(row, state.q, state.parsed); });
  resEl.innerHTML = buf;
  renderPager(page, pages);
}

function renderPager(page, pages){
  if (!pagerEl) return;
  if (pages <= 1) { pagerEl.classList.add('state-hidden'); pagerEl.innerHTML = ''; return; }
  var h = '<div class="pager-links">';
  if (page > 1) h += '<a href="#" data-page="' + (page - 1) + '">' + esc(i18n.previous) + '</a>';
  if (page < pages) h += '<a href="#" data-page="' + (page + 1) + '">' + esc(i18n.next) + '</a>';
  h += '</div>';
  pagerEl.innerHTML = h;
  pagerEl.classList.remove('state-hidden');
  Array.prototype.forEach.call(pagerEl.querySelectorAll('[data-page]'), function(x){
    x.onclick = function(e){
      e.preventDefault();
      search(state.q, parseInt(x.getAttribute('data-page'), 10), true);
    };
  });
}

function search(q, page, push){
  currentQuery = String(q || '').trim();
  var sort = sortEl ? sortEl.value : 'newest';
  clearTimeout(timer);
  if (!currentQuery) {
    history.replaceState(null, '', location.pathname);
    intro();
    return;
  }
  if (push !== false) {
    history.replaceState(null, '', location.pathname + '?q=' + encodeURIComponent(currentQuery)
      + '&page=' + page + '&sort=' + encodeURIComponent(sort));
  }
  fbEl.innerHTML = '<div class="meta">' + esc(i18n.searching_for) + ' <b>' + esc(currentQuery) + '</b>...</div>';
  resEl.innerHTML = '';
  if (pagerEl) { pagerEl.classList.add('state-hidden'); pagerEl.innerHTML = ''; }
  if (progEl) progEl.classList.remove('state-hidden');
  loadIndex().then(function(items){
    if (currentQuery !== String(q || '').trim()) return; /* superseded by a newer query */
    var res = runSearch(items, currentQuery, sort);
    state = { q: currentQuery, rows: res.rows, parsed: res.parsed };
    renderResults(page);
  }).catch(function(err){
    var msg = err && err.message ? ' (' + err.message + ')' : '';
    fbEl.innerHTML = '<div class="error">' + esc(i18n.search_error) + esc(msg) + '</div>';
  }).then(function(){
    if (progEl) progEl.classList.add('state-hidden');
  });
}

form.addEventListener('submit', function(e){
  e.preventDefault();
  clearTimeout(timer);
  search(input.value, 1, true);
});
input.addEventListener('input', function(){
  clearTimeout(timer);
  var q = input.value.trim();
  /* Perf: debounce + skip live search for very short queries, like the live
     plugin — pressing Enter still submits any query length. */
  if (q && q.length < 2) return;
  timer = setTimeout(function(){ search(q, 1, true); }, 400);
});
if (sortEl) {
  sortEl.addEventListener('change', function(){
    clearTimeout(timer);
    search(input.value, 1, true);
  });
}
if (goBackBtn) {
  goBackBtn.addEventListener('click', function(){
    /* When embedded in the DeepSearch overlay iframe, "Go back" should
       simply dismiss the overlay instead of navigating iframe history. */
    if (typeof window !== 'undefined' && window.self !== window.top) {
      window.parent.postMessage({ type: 'cbs_deepsearch_close' }, '*');
      return;
    }
    history.back();
  });
}
if (typeof window !== 'undefined' && window.addEventListener) {
  window.addEventListener('message', function(e){
    if (e.data && e.data.type === 'cbs_deepsearch') {
      input.value = e.data.query;
      clearTimeout(timer);
      timer = setTimeout(function(){ search(e.data.query, 1, false); }, 400);
    }
  });
}

/* Deep link (?q= / ?s= [&page=] [&sort=]) from the sidebar search widget or
   rewritten /search/ URLs runs the search on load. */
(function(){
  var p = new URLSearchParams(location.search);
  var q = (p.get('q') || p.get('s') || '').trim();
  var page = Math.max(1, parseInt(p.get('page') || '1', 10) || 1);
  var sp = p.get('sort') || 'newest';
  if (sortEl && (sp === 'newest' || sp === 'oldest' || sp === 'relevance')) sortEl.value = sp;
  if (q) {
    input.value = q;
    search(q, page, false);
  } else {
    intro();
    loadIndex().catch(function(){}); /* warm the index so the first search is instant */
  }
})();
})();</script>
