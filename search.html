* {
box-sizing: border-box;
/* Match the theme-wide monospace look (theme style.css: * {font-family: Consolas}). */
font-family: Consolas, monospace;
}
html {
/* Canvas underlay (propagated to the full canvas, painted below everything).
   It matches the bg tile's base colour, so while the background layer is
   decoded/rasterized there is nothing bright to flash. */
background-color: #000;
}
html,
body {
margin: 0 !important;
padding: 0 !important;
min-height: 100%;
color: var(--text-color-search);
font: 12px/1.28 Arial, Helvetica, sans-serif;
}

/* Fixed, non-scrolling background layer. Because it never moves while the page
   scrolls (Up/Down/Home/End), the browser never re-rasterizes it, so the
   repeating bg image can no longer flash. It also only spans the viewport
   instead of the whole (potentially huge) document, saving raster memory.
   z-index:-1 keeps it behind all content; the canvas underlay above sits
   beneath it in the same colour, so even a worst-case repaint is invisible. */
body::before {
content: "";
position: fixed;
inset: 0;
z-index: -1;
pointer-events: none;
background-color: #000;
background-repeat: repeat;
background-size: auto;
}

@media (prefers-color-scheme: light) {
html {
background-color: var(--bg, #fff) !important;
}
body::before {
background-color: var(--bg, #fff);
background-image: var(--light-bg-image, none);
}
}
@media (prefers-color-scheme: dark) {
html {
background-color: var(--bg, #000) !important;
}
body::before {
background-color: var(--bg, #000);
background-image: var(--dark-bg-image, none);
}
.search-input,
.sort-select,
.go-back-btn,
.search-btn {
background-color: var(--input-bg-search);
}
}

color: var(--link);
text-decoration: none;
}
a:hover {
text-decoration: underline;
}
.date-label {
color: var(--text-color-search);
font-weight: bold;
}

.page {
max-width: 1200px;
margin: 0 auto;
padding: 16px 18px 28px;
}
.hero {
display: flex;
justify-content: space-between;
align-items: center;
gap: 10px;
padding-top: 8px;

}
.search-line {
display: inline-flex;
align-items: center;
flex-wrap: wrap;
width: 100%;
flex: 1;
gap: 8px;
vertical-align: middle;
}
label {
align-self: center;
color: var(--text-muted-search);
white-space: nowrap;
}
#search-label {
display: none;
}
.search-input {
width: 100%;
flex: 1 1 600px;
height: 30px;
padding: 4px 12px;
border: 1px solid var(--border-color-search);
border-radius: 4px;
background: var(--input-bg-search);
color: var(--text-color-search);
outline: none;
}
.search-input:focus {
border-color: var(--primary-color-search);
box-shadow: inset 0 1px 2px #00000014;
}
.sort-select {
height: 30px;
padding: 0 5px;
border: 1px solid var(--border-color-search);
border-radius: 4px;
background: var(--input-bg-search);
color: var(--text-color-search);
font-size: 12px;
cursor: pointer;
}
.go-back-btn {
display: inline-flex;
align-items: center;
gap: 6px;
height: 30px;
padding: 0 12px;
border: 1px solid var(--border-color-search);
border-radius: 4px;
background: var(--input-bg-search);
color: var(--text-color-search);
font-size: 12px;
cursor: pointer;
transition:
background 0.2s,
border-color 0.2s;
}
.go-back-btn:hover {
border-color: var(--primary-color-search);
color: var(--primary-color-search);
}
.go-back-btn svg {
width: 14px;
height: 14px;
}
.search-btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    height: 30px;
    width: 34px;
    padding: 0;
    border: 1px solid var(--border-color-search);
    border-radius: 4px;
    background: var(--input-bg-search);
    color: var(--text-color-search);
    cursor: pointer;
    transition: background 0.2s, border-color 0.2s, color 0.2s;
}
.search-btn:hover {
border-color: var(--primary-color-search);
color: var(--primary-color-search);
}
.search-btn svg {
width: 16px;
height: 16px;
}

color: inherit;

.results {

}
.result {
margin: 0 0 18px;
}
/* Thumbnail column. The renderer adds .result--thumb to EVERY result while the
   feature is on - not just the ones with media - so the list keeps a single
   left edge. Turning the setting off removes it and the plain block layout
   returns. */
.result--thumb {
  display: flex;
  align-items: flex-start;
  gap: 12px;
}
.result--thumb .result-body {
  min-width: 0;
  flex: 1 1 auto;
}
.result-thumb {
  /* display:block so the empty <span> placeholder is sized by width/height
     exactly like the <img>; an inline box would ignore both. */
  display: block;
  flex: 0 0 auto;
  width: 96px;
  height: 96px;
  /* No border. The theme paints media with var(--media-border), but that is
     deliberately NOT inherited here: at 96px the dotted frame reads as noise
     around every row. Only the corner radius is taken from the theme
     (--media-radius, forwarded by cbs_theme_vars() and identical in light and
     dark mode), so the thumbs still match the theme's media shape while the
     image sits directly on the panel background. */
  border: 0;
  border-radius: var(--media-radius, 10px);
  object-fit: cover;
  background: var(--input-bg-search);
  opacity: 0;
  transition: opacity 0.2s;
}
/* The real image has landed: fade it in over the placeholder. */
.result-thumb.is-loaded {
  opacity: 1;
}
/* The post HAS media but every URL for it failed (see the error handler in
   loadThumbs). Fall back to the photo glyph, because a picture was expected and
   only failed to load - not a text-only post. The failed <img> is swapped for a
   plain <span> by that handler, because ::after cannot render on a replaced
   element; this rule therefore paints into an ordinary box and needs none of the
   broken-image suppression a dead <img> would have required. */
.result-thumb.is-failed {
  opacity: 1;
  background-color: var(--input-bg-search);
  /* Anchor for the ::after glyph layer. The glyph cannot be painted as a
     background-image here for the same reason as on .is-none: a data: URI is an
     isolated document, so custom properties cannot reach a fill inside it. It is
     masked instead, which reads only the alpha channel and lets the colour come
     from CSS. That forces the glyph onto its own layer, because
     background-color always paints *under* background-image - both on one element
     would hide the glyph colour behind the cell fill. */
  position: relative;
}
/* Photo mark, drawn as a mask so it takes the theme's --link colour, exactly as
   the quote glyph does on .is-none::after. Only the alpha channel of the data URI
   is used; the colour and the translucency both come from CSS below.
   -webkit-mask-* is kept alongside mask-* for Safari < 15.4, which ships only
   the prefixed form. */
.result-thumb.is-failed::after {
  content: "";
  position: absolute;
  top: 0;
  right: 0;
  bottom: 0;
  left: 0;
  background-color: var(--link);
  /* The translucency the glyph used to carry as opacity="0.55" inside the SVG,
     now applied here so it stays tunable without regenerating the data URI. */
  opacity: 0.55;
  -webkit-mask-image: var(--cbs-thumb-placeholder-image);
  mask-image: var(--cbs-thumb-placeholder-image);
  -webkit-mask-repeat: no-repeat;
  mask-repeat: no-repeat;
  -webkit-mask-position: center;
  mask-position: center;
  /* Square viewBox (100 x 100), so a single percentage scales both axes and the
     mark stays centred and undistorted in the square cell. */
  -webkit-mask-size: 55%;
  mask-size: 55%;
}
/* No usable media: an empty reserved cell. It keeps the row height and the
   shared left edge, but it no longer shows the photo mark: a post with no media
   would display "missing picture" forever while never resolving to one. A
   quotation mark says why the cell is empty instead - this is a text-only post.
   The photo glyph stays on the <img> above, where the image really is coming. */
.result-thumb.is-none {
  opacity: 1;
  background-color: var(--input-bg-search);
  /* Anchor for the ::after glyph layer below. The mobile override only resizes
     .result-thumb, so the layer follows the cell automatically. */
  position: relative;
}
/* The quote glyph is NOT painted as a background-image here.
   A data: URI is an isolated document, so CSS custom properties never cascade
   into it: a fill="var(--link)" written inside the SVG would not resolve, and
   the glyph could never follow the theme. Using the same SVG as a MASK reads
   only its alpha channel, so the colour can come from this layer's own
   background-color - which is what finally lets the quote track var(--link)
   (#24890d light / #0fa dark) exactly like every other accent on the page.
   A separate ::after is required because background-color is always painted
   *under* background-image: painting both on this element would let the cell
   fill hide the glyph colour entirely.
   -webkit-mask-* is kept alongside mask-* for Safari < 15.4, which ships only
   the prefixed form. */
.result-thumb.is-none::after {
  content: "";
  position: absolute;
  top: 0;
  right: 0;
  bottom: 0;
  left: 0;
  background-color: var(--link);
  /* The translucency the glyph used to carry as opacity="0.55" inside the SVG,
     now applied here so it stays tunable without regenerating the data URI. */
  opacity: 0.55;
  -webkit-mask-image: var(--cbs-thumb-placeholder-quote);
  mask-image: var(--cbs-thumb-placeholder-quote);
  -webkit-mask-repeat: no-repeat;
  mask-repeat: no-repeat;
  -webkit-mask-position: center;
  mask-position: center;
  /* The quote icon's own viewBox is wider than tall (122.88 x 108.51), so only
     the width is set and the height follows the aspect ratio, which keeps the
     bubble undistorted and centred in the square cell. */
  -webkit-mask-size: 58%;
  mask-size: 58%;
}

}
}
@media (max-width: 700px) {

.search-input {

}
/* Responsive layout (image 02): the thumbnail FLOATS instead of holding a
   flex column open. As a flex item it reserved a permanent 64px gutter and
   squeezed the title, URL and snippet into a narrow column for the entire
   height of the snippet. Floated, the same markup wraps beside the cell for as
   many lines as it is tall and then returns to the full column width.

   The title MUST be display:block here for that to happen. It is an
   inline-block in the base rules, and an inline-block is an atomic inline: it
   never overlaps a float, so the browser pushed the WHOLE title down below the
   64px cell instead of letting it sit beside it. That left an empty band to the
   right of the thumbnail - the exact hole this fixes - and then dropped the URL
   and snippet below it too, wasting the full width of every row.

   As a block the title's own line boxes wrap around the float, so the title
   occupies the space beside the thumbnail and the URL follows underneath it. */
  .result--thumb {
    display: flow-root;
  }
  .result--thumb .result-body {
    display: block;
    flex: none;
  }
  .result--thumb .result-title {
    display: block;
  }
  .result-thumb {
    float: left;
    width: 64px;
    height: 64px;
    margin: 0 10px 6px 0;
  }

}
:root {
--cbs-thumb-placeholder-image: url("mu-plugins/wptr-icon-image.svg");
--cbs-thumb-placeholder-quote: url("mu-plugins/wptr-icon-quote.svg");
}

/* -- Highlighting — port of the live plugin's helpers -- */
var _decoder = document.createElement('div');
function decodeEntities(s){
  _decoder.innerHTML = s == null ? '' : String(s);
  return _decoder.textContent;
}
function esc(v){
  var d = document.createElement('div');
  d.textContent = decodeEntities(v == null ? '' : String(v));
  return d.innerHTML;
}
function getHighlightTerms(q){
  if (!q) return [];
  var text = q;
  text = text.replace(/\b(?:author|after|before|id|relatedsearch(?:\[[^\]]+\])?):(?:"[^"]+"|'[^']+'|\S+)/gi, ' ');
  text = text.replace(/(^|\s)-(?:"[^"]*"|'[^']*'|\S+)/g, ' ');
  text = text.replace(/(^|\s)OR(?=\s|$)/g, ' ');

  while ((pm = phraseRe.exec(text)) !== null) {

  phrases.forEach(function(phrase){
    var key = phrase.toLowerCase();

  });

  var safe = esc(text);

  if (!terms.length) return safe;
  var pattern = terms.map(function(term){ return term.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'); }).join('|');

function intro(){

function renderResult(row, q, parsed){
  var item = row.item;

  var body = itemBody(item);
  var snippet = (body && terms.length) ? keywordSnippet(body, terms) : null;

/* Bind the real resolver URL into every freshly rendered thumbnail.

   exist?" - archive.org generates it for some items and not others, and the
   URL itself cannot tell you which. The <img> therefore carries the resolver's
   primary URL directly (with data-src mirroring it, same attribute the live
   page uses) and the post's own image rides along in data-fallback for a
   one-shot retry when the derivative 404s. Once both answers fail the <img>
   becomes an in-place .is-failed span: the CELL survives (the body text keeps
   its horizontal position) and the photo glyph still marks the post as HAVING
   media - only the download is missing, not the picture. */

  if (!cfg.thumbs || !root) return;
  var imgs = root.querySelectorAll('img.result-thumb[data-src]:not([data-bound])');
  Array.prototype.forEach.call(imgs, function(img){
    var real = img.getAttribute('data-src');

    img.setAttribute('data-bound', '1');

function renderResults(page){

    if (stateChanged) {
      var capturedQuery = currentQuery;
      var capturedPage = page;
      var capturedSort = sort;
      pushTimer = setTimeout(function(){
        if (currentQuery !== capturedQuery) return;
        history.pushState({ q: capturedQuery, page: capturedPage, sort: capturedSort }, '', urlBase);
        lastPushedQuery = capturedQuery;
        lastPushedPage = capturedPage;
        lastPushedSort = capturedSort;
      }, 4000);
    } else {
      lastPushedQuery = currentQuery;
      lastPushedPage = page;
      lastPushedSort = sort;
    }
  }
  fbEl.innerHTML = '<div class="meta">' + esc(i18n.searching_for) + ' <b class="meta-match">' + esc(currentQuery) + '</b>...</div>';
  resEl.innerHTML = '';
  if (pagerEl) { pagerEl.classList.add('state-hidden'); pagerEl.innerHTML = ''; }
  if (progEl) progEl.classList.remove('state-hidden');
  loadIndex().then(function(items){
    if (currentQuery !== String(q || '').trim()) return; /* superseded by a newer query */
    var res = runSearch(items, currentQuery, sort);
    state = { q: currentQuery, rows: res.rows, parsed: res.parsed, did_you_mean: res.did_you_mean };
    renderResults(page);
  }).catch(function(err){
    var msg = err && err.message ? ' (' + err.message + ')' : '';
    fbEl.innerHTML = '<div class="error">' + esc(i18n.search_error) + esc(msg) + '</div>';
  }).then(function(){
    if (progEl) progEl.classList.add('state-hidden');
  });
}

form.addEventListener('submit', function(e){
  e.preventDefault();
  clearTimeout(timer);
  search(input.value, 1, true);
});
input.addEventListener('input', function(){
  clearTimeout(timer);
  var q = input.value.trim();
  /* Perf: debounce + skip live search for very short queries, like the live
     plugin — pressing Enter still submits any query length. */
  if (q && q.length < 2) return;
  timer = setTimeout(function(){ search(q, 1, true); }, 400);
});
if (sortEl) {
  sortEl.addEventListener('change', function(){
    clearTimeout(timer);
    search(input.value, 1, true);
  });
}
if (searchBtn) {
  searchBtn.addEventListener('click', function(){
    clearTimeout(timer);
    search(input.value, 1, true);
  });
}
if (goBackBtn) {
  goBackBtn.addEventListener('click', function(){
    /* When embedded in the DeepSearch overlay iframe, "Go back" should
       simply dismiss the overlay instead of navigating iframe history. */
    if (typeof window !== 'undefined' && window.self !== window.top) {
      window.parent.postMessage({ type: 'cbs_deepsearch_close' }, '*');
      return;
    }
    history.back();
  });
}
if (typeof window !== 'undefined' && window.addEventListener) {
  window.addEventListener('message', function(e){
    if (e.data && e.data.type === 'cbs_deepsearch') {
      input.value = e.data.query;
      clearTimeout(timer);
      timer = setTimeout(function(){ search(e.data.query, 1, false); }, 400);
    }
  });
}

if (typeof window !== 'undefined' && window.addEventListener) {
  window.addEventListener('popstate', function(){
    clearTimeout(timer);
    clearTimeout(pushTimer);
    pushTimer = null;
    var p = new URLSearchParams(location.search);
    var q = (p.get('q') || p.get('s') || '').trim();
    var page = Math.max(1, parseInt(p.get('page') || '1', 10) || 1);
    var sp = p.get('sort') || 'relevance';
    if (sortEl && (sp === 'newest' || sp === 'oldest' || sp === 'relevance' || sp === 'az' || sp === 'za')) sortEl.value = sp;
    if (q) {
      input.value = q;
      search(q, page, false);
    } else {
      input.value = '';
      intro();
    }
  });
}

/* Deep link (?q= / ?s= [&page=] [&sort=]) from the sidebar search widget or
   rewritten /search/ URLs runs the search on load. */
(function(){
  var p = new URLSearchParams(location.search);
  var q = (p.get('q') || p.get('s') || '').trim();
  var page = Math.max(1, parseInt(p.get('page') || '1', 10) || 1);
  /* Default sort - cbs_default_sort(): "relevance" (Melhores resultados),
     so the static page opens with the same ordering as the live /search/. */
  var sp = p.get('sort') || 'relevance';
  if (sortEl && (sp === 'newest' || sp === 'oldest' || sp === 'relevance' || sp === 'az' || sp === 'za')) sortEl.value = sp;
  if (q) {
    input.value = q;
    search(q, page, false);
  } else {
    intro();
    loadIndex().catch(function(){}); /* warm the index so the first search is instant */
  }
})();
})();</script>
